{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация сотрудника</title>
    <link rel="stylesheet" href="{% static 'bookings/style.css' %}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1 style="text-align: center; margin-bottom: 20px; font-size: 24px;">Регистрация</h1>
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Логин:</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Пароль:</label>
                <input type="password" name="password" required>
            </div>
            <div class="form-group">
                <label>Повторите пароль:</label>
                <input type="password" name="password_confirm" required>
            </div>
            <button type="submit" class="btn-auth-submit reg">Зарегистрироваться</button>
        </form>
        <a href="{% url 'login' %}" class="link-text">Уже есть аккаунт? Войти</a>
    </div>
</body>
</html>
