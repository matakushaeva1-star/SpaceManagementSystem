{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <link rel="stylesheet" href="{% static 'bookings/style.css' %}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <h1 style="text-align: center; margin-bottom: 20px; font-size: 24px;">Вход в систему</h1>
        {% if error %}
            <div class="error-msg">{{ error }}</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Логин:</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Пароль:</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-auth-submit">Войти</button>
        </form>
        <a href="{% url 'register' %}" class="link-text">Нет аккаунта? Зарегистрироваться</a>
    </div>
</body>
</html>
